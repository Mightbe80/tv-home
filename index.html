<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: none; }

  /* wallpapers: stacked layers that cross-fade */
  .wall { position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0;
    -webkit-transition: opacity 3s ease; transition: opacity 3s ease; }
  .wall.on { opacity: 1; }
  .w0 { background: -webkit-linear-gradient(315deg, #0f2027, #203a43 50%, #2c5364); background: linear-gradient(135deg, #0f2027, #203a43 50%, #2c5364); }
  .w1 { background: -webkit-linear-gradient(315deg, #1a0b2e, #3b1a5a 55%, #7a2e6e); background: linear-gradient(135deg, #1a0b2e, #3b1a5a 55%, #7a2e6e); }
  .w2 { background: -webkit-linear-gradient(315deg, #0b1a14, #12362b 55%, #1f6b52); background: linear-gradient(135deg, #0b1a14, #12362b 55%, #1f6b52); }
  .w3 { background: -webkit-linear-gradient(315deg, #1c1208, #4a2c10 55%, #a8591a); background: linear-gradient(135deg, #1c1208, #4a2c10 55%, #a8591a); }
  .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0.15), rgba(0,0,0,0.55)); background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(0,0,0,0.55)); }

  .stage { position: absolute; top: 0; left: 0; right: 0; bottom: 0; padding: 5% 6%; }

  .top { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: flex-start; align-items: flex-start; }
  .clock { font-size: 7.2vw; font-weight: 200; letter-spacing: 0.02em; line-height: 1; }
  .date { font-size: 1.9vw; margin-top: 1.2vw; opacity: 0.75; letter-spacing: 0.04em; }
  .greet { font-size: 2.2vw; margin-top: 2.4vw; opacity: 0.9; font-weight: 300; }
  .wx { text-align: right; }
  .wx .temp { font-size: 4.6vw; font-weight: 200; line-height: 1; }
  .wx .desc { font-size: 1.7vw; opacity: 0.75; margin-top: 0.8vw; }
  .wx .city { font-size: 1.4vw; opacity: 0.55; margin-top: 0.4vw; letter-spacing: 0.1em; text-transform: uppercase; }

  .dock { position: absolute; left: 6%; right: 6%; bottom: 8%; }
  .dock-title { font-size: 1.4vw; opacity: 0.55; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 1.6vw; }
  .row { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .tile { width: 15.5vw; height: 9.6vw; margin: 0 1.6vw 1.6vw 0; border-radius: 1.2vw;
    background: rgba(255,255,255,0.10); border: 0.2vw solid rgba(255,255,255,0.12);
    display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
    -webkit-transition: -webkit-transform 0.18s ease, background 0.18s ease, border-color 0.18s ease;
    transition: transform 0.18s ease, background 0.18s ease, border-color 0.18s ease; }
  .tile .ico { font-size: 3.4vw; line-height: 1; margin-bottom: 0.8vw; }
  .tile .nm { font-size: 1.6vw; letter-spacing: 0.04em; }
  .tile.focus { -webkit-transform: scale(1.08); transform: scale(1.08);
    background: rgba(255,255,255,0.26); border-color: rgba(255,255,255,0.9); }

  .hint { position: absolute; left: 6%; bottom: 3%; font-size: 1.2vw; opacity: 0.4; letter-spacing: 0.08em; }
</style>
</head>
<body>
  <div class="wall w0 on"></div>
  <div class="wall w1"></div>
  <div class="wall w2"></div>
  <div class="wall w3"></div>
  <div class="shade"></div>

  <div class="stage">
    <div class="top">
      <div>
        <div class="clock" id="clock">--:--</div>
        <div class="date" id="date"></div>
        <div class="greet" id="greet"></div>
      </div>
      <div class="wx">
        <div class="temp" id="temp"></div>
        <div class="desc" id="desc"></div>
        <div class="city" id="city"></div>
      </div>
    </div>

    <div class="dock">
      <div class="dock-title">Shortcuts</div>
      <div class="row" id="row"></div>
    </div>
    <div class="hint">Arrows to move  /  OK to open</div>
  </div>

<script>
(function () {
  // ===== EDIT THESE =====
  var CITY = "Dubai";
  var LAT = 25.2048, LON = 55.2708;
  var SHORTCUTS = [
    { name: "YouTube",  icon: "\u25B6", url: "https://www.youtube.com/tv" },
    { name: "Netflix",  icon: "N",      url: "https://www.netflix.com" },
    { name: "Shahid",   icon: "S",      url: "https://shahid.mbc.net" },
    { name: "Google",   icon: "G",      url: "https://www.google.com" },
    { name: "News",     icon: "\u2630", url: "https://news.google.com" },
    { name: "Weather",  icon: "\u2600", url: "https://www.timeanddate.com/weather/uae/dubai" }
  ];
  // ======================

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? "0" : "") + n; }

  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function tick() {
    var d = new Date();
    $("clock").innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("date").innerHTML = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
    var h = d.getHours();
    $("greet").innerHTML = h < 5 ? "Good night" : h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : h < 21 ? "Good evening" : "Good night";
  }
  tick();
  setInterval(tick, 15000);

  // weather (free, no key). Fails quietly if the TV browser blocks it.
  var CODES = { 0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm" };
  function weather() {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON + "&current_weather=true", true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4 || x.status !== 200) return;
        try {
          var c = JSON.parse(x.responseText).current_weather;
          $("temp").innerHTML = Math.round(c.temperature) + "\u00B0";
          $("desc").innerHTML = CODES[c.weathercode] || "";
          $("city").innerHTML = CITY;
        } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }
  weather();
  setInterval(weather, 30 * 60 * 1000);

  // wallpapers cross-fade every 45s
  var walls = document.getElementsByClassName("wall");
  var wi = 0;
  setInterval(function () {
    walls[wi].className = walls[wi].className.replace(" on", "");
    wi = (wi + 1) % walls.length;
    walls[wi].className += " on";
  }, 45000);

  // tiles + remote navigation
  var row = $("row"), tiles = [], cur = 0, i;
  for (i = 0; i < SHORTCUTS.length; i++) {
    var t = document.createElement("div");
    t.className = "tile";
    t.innerHTML = '<div class="ico">' + SHORTCUTS[i].icon + '</div><div class="nm">' + SHORTCUTS[i].name + "</div>";
    row.appendChild(t);
    tiles.push(t);
  }
  function setFocus(n) {
    if (n < 0 || n >= tiles.length) return;
    tiles[cur].className = "tile";
    cur = n;
    tiles[cur].className = "tile focus";
  }
  setFocus(0);

  function perRow() {
    var top = tiles[0].offsetTop, n = 0;
    while (n < tiles.length && tiles[n].offsetTop === top) n++;
    return n || 1;
  }

  document.onkeydown = function (e) {
    var k = e.keyCode, pr = perRow();
    if (k === 37) setFocus(cur - 1);
    else if (k === 39) setFocus(cur + 1);
    else if (k === 38) setFocus(cur - pr);
    else if (k === 40) setFocus(cur + pr);
    else if (k === 13) window.location.href = SHORTCUTS[cur].url;
    else return;
    if (e.preventDefault) e.preventDefault();
  };
})();
</script>
</body>
</html>
