<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Oswald:300,400">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05060a; color: #fff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; cursor: none; }

  /* scenes: stacked SVG wallpapers that cross-fade */
  .wall { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0;
    -webkit-transition: opacity 3s ease; transition: opacity 3s ease; }
  .wall.on { opacity: 1; }
  .wall svg { width: 100%; height: 100%; display: block; }
  .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.32) 45%, rgba(0,0,0,0.68) 100%);
    background: linear-gradient(to bottom, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.32) 45%, rgba(0,0,0,0.68) 100%); }

  /* real photos (wall1.jpg ... wall4.jpg) sit on top of the vector scenes when present */
  .photo { position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 0;
    -webkit-transition: opacity 3s ease; transition: opacity 3s ease; }
  .photo.on { opacity: 1; }
  .cp { background-image: -webkit-linear-gradient(top, #ffffff 20%, #cfd3ff 90%); background-image: linear-gradient(to bottom, #ffffff 20%, #cfd3ff 90%); }
  .icon.img { background-size: cover; background-position: center; background-repeat: no-repeat; }

  /* date + weather line */
  .info { position: absolute; top: 6%; left: 0; right: 0; text-align: center;
    font-size: 1.7vw; letter-spacing: 0.04em; opacity: 0.88; text-shadow: 0 0 1vw rgba(0,0,0,0.35); }
  .info .dot { opacity: 0.5; padding: 0 0.8vw; }

  /* weather widget, top right */
  .wxw { position: absolute; top: 5%; right: 5%; display: -webkit-flex; display: flex; opacity: 0;
    -webkit-transform: scale(0.7); transform: scale(0.7); -webkit-transform-origin: 100% 0; transform-origin: 100% 0;
    -webkit-transition: opacity 1s ease; transition: opacity 1s ease; text-shadow: 0 0 1vw rgba(0,0,0,0.55); }
  .wxw.on { opacity: 1; }
  .wxl { margin-right: 2vw; }
  .wcity { font-size: 1.2vw; letter-spacing: 0.18em; opacity: 0.8; }
  .wtemp { font-size: 6vw; font-weight: 200; line-height: 1.05; }
  .whl { font-size: 1.3vw; opacity: 0.85; margin-top: 0.4vw; letter-spacing: 0.04em; }
  .wicon svg { width: 5.4vw; height: 5.4vw; display: block; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .wdesc { font-size: 1.1vw; letter-spacing: 0.12em; text-transform: uppercase; margin: 0.4vw 0 0.6vw; }
  .wrow { font-size: 1.2vw; opacity: 0.92; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-top: 0.35vw; }
  .wrow svg { width: 1.3vw; height: 1.3vw; margin-right: 0.7vw; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* giant gradient clock */
  .clock { position: absolute; top: 12%; left: 0; right: 0; text-align: center; line-height: 1;
    font-family: "Oswald", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 300;
    font-size: 15vw; letter-spacing: 0.01em;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent; }
  .c0 { background-image: -webkit-linear-gradient(top, #ffffff 15%, #f4a6c0 85%); background-image: linear-gradient(to bottom, #ffffff 15%, #f4a6c0 85%); }
  .c1 { background-image: -webkit-linear-gradient(top, #fff3dc 15%, #f5a96a 85%); background-image: linear-gradient(to bottom, #fff3dc 15%, #f5a96a 85%); }
  .c2 { background-image: -webkit-linear-gradient(top, #ffffff 15%, #8fa8ff 85%); background-image: linear-gradient(to bottom, #ffffff 15%, #8fa8ff 85%); }
  .c3 { background-image: -webkit-linear-gradient(top, #ffffff 15%, #8fe0d6 85%); background-image: linear-gradient(to bottom, #ffffff 15%, #8fe0d6 85%); }

  /* icon dock */
  .dock { position: absolute; left: 6%; right: 6%; bottom: 7%; }
  .row { display: -webkit-flex; display: flex; -webkit-align-items: flex-start; align-items: flex-start; -webkit-justify-content: center; justify-content: center; }
  .cell { width: 8.2vw; margin: 0 0.9vw; text-align: center; }
  .icon { width: 8.2vw; height: 8.2vw; border-radius: 1.9vw; position: relative;
    display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center;
    font-weight: 700; font-size: 3.3vw; color: #fff; box-shadow: 0 0.8vw 2vw rgba(0,0,0,0.4);
    -webkit-transition: -webkit-transform 0.22s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.22s ease; transition: transform 0.22s cubic-bezier(0.2,0.8,0.2,1), box-shadow 0.22s ease; }
  .icon small { position: absolute; left: 0; right: 0; bottom: 0.9vw; font-size: 1.1vw; font-weight: 600; letter-spacing: 0.06em; opacity: 0.85; text-transform: uppercase; }
  .label { margin-top: 1vw; font-size: 1.3vw; letter-spacing: 0.04em; opacity: 0; -webkit-transition: opacity 0.2s ease; transition: opacity 0.2s ease; }
  .cell.focus .icon { -webkit-transform: scale(1.18) translateY(-0.5vw); transform: scale(1.18) translateY(-0.5vw);
    box-shadow: 0 0 0 0.25vw rgba(0,0,0,0.6), 0 0 0 0.5vw #ffffff, 0 1.4vw 3.4vw rgba(0,0,0,0.6); }
  .cell.focus .label { opacity: 1; }
</style>
</head>
<body>

  <!-- Scene 0: dusk peak -->
  <div class="wall on"><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2150"/><stop offset="0.5" stop-color="#8c4a80"/><stop offset="0.85" stop-color="#e7897f"/><stop offset="1" stop-color="#f3b48a"/></linearGradient>
      <radialGradient id="g0" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd2a8" stop-opacity="0.8"/><stop offset="1" stop-color="#ffd2a8" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#s0)"/>
    <circle cx="960" cy="820" r="520" fill="url(#g0)"/>
    <polygon points="0,880 260,700 470,800 700,640 930,820 1150,690 1400,790 1650,650 1920,820 1920,1080 0,1080" fill="#4a3358" opacity="0.75"/>
    <polygon points="0,950 300,820 520,900 780,760 960,520 1080,700 1240,640 1500,860 1750,780 1920,900 1920,1080 0,1080" fill="#1c1426"/>
    <polygon points="0,1010 400,930 800,990 1200,920 1600,1000 1920,950 1920,1080 0,1080" fill="#0e0a14"/>
  </svg></div>

  <!-- Scene 1: dune sunset -->
  <div class="wall"><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1032"/><stop offset="0.45" stop-color="#b24f7c"/><stop offset="0.8" stop-color="#f09a5c"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
      <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff0c0" stop-opacity="0.95"/><stop offset="0.35" stop-color="#ffb066" stop-opacity="0.5"/><stop offset="1" stop-color="#ffb066" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#s1)"/>
    <circle cx="1320" cy="760" r="480" fill="url(#g1)"/>
    <circle cx="1320" cy="760" r="70" fill="#fff4d0"/>
    <path d="M0,800 C300,720 600,860 960,790 C1300,730 1600,830 1920,770 L1920,1080 L0,1080 Z" fill="#a8502e"/>
    <path d="M0,880 C350,800 700,940 1100,860 C1450,800 1700,900 1920,850 L1920,1080 L0,1080 Z" fill="#7a3322"/>
    <path d="M0,960 C400,900 800,1010 1200,950 C1550,900 1750,980 1920,940 L1920,1080 L0,1080 Z" fill="#43191a"/>
  </svg></div>

  <!-- Scene 2: night sky -->
  <div class="wall"><svg id="nightsvg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#04050d"/><stop offset="0.6" stop-color="#101a3c"/><stop offset="1" stop-color="#2b3f78"/></linearGradient>
      <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8fa8ff" stop-opacity="0.35"/><stop offset="1" stop-color="#8fa8ff" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#s2)"/>
    <circle cx="520" cy="300" r="420" fill="url(#g2)"/>
    <g id="stars"></g>
    <polygon points="0,900 240,780 520,860 820,700 1080,840 1380,740 1680,860 1920,780 1920,1080 0,1080" fill="#0b1228"/>
    <polygon points="0,990 380,920 760,985 1180,915 1560,990 1920,930 1920,1080 0,1080" fill="#05081a"/>
  </svg></div>

  <!-- Scene 3: teal dawn over water -->
  <div class="wall"><svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2433"/><stop offset="0.5" stop-color="#2a7684"/><stop offset="0.72" stop-color="#f2c9a0"/><stop offset="0.73" stop-color="#d89a7a"/><stop offset="1" stop-color="#143846"/></linearGradient>
      <radialGradient id="g3" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff2cf" stop-opacity="0.9"/><stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="1920" height="1080" fill="url(#s3)"/>
    <circle cx="960" cy="780" r="420" fill="url(#g3)"/>
    <rect x="860" y="790" width="200" height="290" fill="#ffe6b8" opacity="0.18"/>
    <rect x="900" y="800" width="120" height="280" fill="#ffe6b8" opacity="0.22"/>
    <polygon points="0,790 420,740 860,790 1300,745 1920,795 1920,810 0,810" fill="#10303c" opacity="0.7"/>
  </svg></div>

  <div id="photos"></div>
  <div class="shade"></div>

  <div class="info" id="info"></div>
  <div class="wxw" id="wxw">
    <div class="wxl">
      <div class="wcity" id="wcity">DUBAI</div>
      <div class="wtemp" id="wtemp">--</div>
      <div class="whl" id="whl"></div>
    </div>
    <div class="wxr">
      <div class="wicon" id="wicon"></div>
      <div class="wdesc" id="wdesc"></div>
      <div class="wrow"><svg viewBox="0 0 24 24"><path d="M12 3C12 3 5 11 5 16a7 7 0 0 0 14 0C19 11 12 3 12 3z"/></svg><span id="whum"></span></div>
      <div class="wrow"><svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8"/></svg><span id="wwind"></span></div>
      <div class="wrow"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg><span id="wdir"></span></div>
    </div>
  </div>

  <div class="clock c0" id="clock">00:00</div>

  <div class="dock"><div class="row" id="row"></div></div>

<script>
(function () {
  // ===== EDIT THESE =====
  var LAT = 25.2048, LON = 55.2708;
  var APPS = [
    { name: "YouTube",  mark: "▶", bg: "#c4302b", url: "https://www.youtube.com/tv" },
    { name: "Netflix",  mark: "N",      bg: "#1c1c1f", url: "https://www.netflix.com" },
    { name: "Shahid",   mark: "S",      bg: "#2f6b5e", url: "https://shahid.mbc.net" },
    { name: "TOD",      mark: '<span style="font-size:2.5vw">TOD</span>', bg: "#3a1d6e", url: "https://www.tod.tv" },
    { name: "Apple TV", mark: "tv",     bg: "#000000", url: "https://tv.apple.com" },
    { name: "Google",   mark: "G",      bg: "#3b6fd8", url: "https://www.google.com" }
  ];
  // Optional real artwork, uploaded next to index.html in the repo.
  // Photos: wall1.jpg, wall2.jpg, wall3.jpg, wall4.jpg (1920x1080 JPEG, under 500 KB each)
  // Icons:  these file names (square PNG, 512x512). Missing files fall back to the coloured tile.
  var PHOTOS = ["wall1.jpg", "wall2.jpg", "wall3.jpg", "wall4.jpg"];
  var IMG = { "YouTube": "icon-youtube.png", "Netflix": "icon-netflix.png", "Shahid": "icon-shahid.png",
    "TOD": "icon-tod.png", "Apple TV": "icon-appletv.png",
    "Google": "icon-google.png", "News": "icon-news.png", "Weather": "icon-weather.png" };
  // ======================

  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var wx = "";

  function paintInfo() {
    var d = new Date();
    $("info").innerHTML = DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] +
      (wx ? '<span class="dot">•</span>' + wx : "");
  }
  function tick() {
    var d = new Date();
    $("clock").innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
    paintInfo();
  }
  tick();
  setInterval(tick, 15000);

  // weather (free, no key). Fails quietly if the TV browser blocks it.
  var CODES = { 0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",80:"Showers",81:"Showers",82:"Heavy showers",95:"Thunderstorm",96:"Thunderstorm",99:"Thunderstorm" };
  function wIcon(code) {
    var sun = '<circle cx="32" cy="32" r="10"/><path d="M32 10v6M32 48v6M10 32h6M48 32h6M16 16l4 4M44 44l4 4M16 48l4-4M44 20l4-4"/>';
    var cloud = '<path d="M20 48h24a9 9 0 0 0 1-18 13 13 0 0 0-25-3 10.5 10.5 0 0 0 0 21z"/>';
    var body;
    if (code === 0 || code === 1) body = sun;
    else if (code === 2) body = '<circle cx="22" cy="22" r="7"/><path d="M22 7v4M7 22h4M11 11l3 3M33 11l-3 3"/><g transform="translate(8,6)">' + cloud + '</g>';
    else if (code === 3) body = cloud;
    else if (code === 45 || code === 48) body = '<g transform="translate(0,-6)">' + cloud + '</g><path d="M16 50h32M20 57h24"/>';
    else if (code >= 95) body = '<g transform="translate(0,-6)">' + cloud + '</g><path d="M33 40l-6 9h8l-5 9"/>';
    else body = '<g transform="translate(0,-6)">' + cloud + '</g><path d="M24 48l-3 8M33 48l-3 8M42 48l-3 8"/>';
    return '<svg viewBox="0 0 64 64">' + body + '</svg>';
  }
  var DIRS = ["N","NE","E","SE","S","SW","W","NW"];
  function weather() {
    try {
      var x = new XMLHttpRequest();
      x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=" + LAT + "&longitude=" + LON +
        "&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m" +
        "&daily=temperature_2m_max,temperature_2m_min&timezone=auto", true);
      x.onreadystatechange = function () {
        if (x.readyState !== 4 || x.status !== 200) return;
        try {
          var j = JSON.parse(x.responseText), c = j.current, d = j.daily;
          $("wtemp").innerHTML = Math.round(c.temperature_2m) + "°";
          $("whl").innerHTML = "H: " + Math.round(d.temperature_2m_max[0]) + "° &nbsp; L: " + Math.round(d.temperature_2m_min[0]) + "°";
          $("wicon").innerHTML = wIcon(c.weather_code);
          $("wdesc").innerHTML = CODES[c.weather_code] || "";
          $("whum").innerHTML = Math.round(c.relative_humidity_2m) + "%";
          $("wwind").innerHTML = Math.round(c.wind_speed_10m) + " km/h";
          $("wdir").innerHTML = DIRS[Math.round(c.wind_direction_10m / 45) % 8];
          $("wxw").className = "wxw on";
        } catch (e) {}
      };
      x.send();
    } catch (e) {}
  }
  weather();
  setInterval(weather, 30 * 60 * 1000);

  // stars for the night scene
  (function () {
    var g = $("stars"), ns = "http://www.w3.org/2000/svg", i, c, seed = 7;
    function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (i = 0; i < 160; i++) {
      c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", Math.round(rnd() * 1920));
      c.setAttribute("cy", Math.round(rnd() * 700));
      c.setAttribute("r", (0.6 + rnd() * 1.6).toFixed(1));
      c.setAttribute("fill", "#ffffff");
      c.setAttribute("opacity", (0.35 + rnd() * 0.65).toFixed(2));
      g.appendChild(c);
    }
  })();

  // scenes cross-fade every 45s, clock tint follows the scene
  var walls = document.getElementsByClassName("wall");
  var wi = 0, photos = [], pi = 0, pk;

  function addPhoto(name) {
    var im = new Image();
    im.onload = function () {
      var d = document.createElement("div");
      d.className = "photo";
      d.style.backgroundImage = "url(" + name + ")";
      $("photos").appendChild(d);
      photos.push(d);
      if (photos.length === 1) {
        d.className = "photo on";
        var k;
        for (k = 0; k < walls.length; k++) walls[k].style.display = "none";
        $("clock").className = "clock cp";
      }
    };
    im.src = name;
  }
  for (pk = 0; pk < PHOTOS.length; pk++) addPhoto(PHOTOS[pk]);

  setInterval(function () {
    if (photos.length) {
      if (photos.length < 2) return;
      photos[pi].className = "photo";
      pi = (pi + 1) % photos.length;
      photos[pi].className = "photo on";
      return;
    }
    walls[wi].className = walls[wi].className.replace(" on", "");
    wi = (wi + 1) % walls.length;
    walls[wi].className += " on";
    $("clock").className = "clock c" + wi;
  }, 45000);

  // icon dock + remote navigation (left / right / OK)
  var row = $("row"), cells = [], cur = 0, i;
  for (i = 0; i < APPS.length; i++) {
    var a = APPS[i], cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = '<div class="icon" style="background:' + a.bg + '">' + a.mark + '</div><div class="label">' + a.name + "</div>";
    row.appendChild(cell);
    cells.push(cell);
    (function (src, box) {
      if (!src) return;
      var im = new Image();
      im.onload = function () {
        box.className = "icon img";
        box.style.backgroundColor = "transparent";
        box.style.backgroundImage = "url(" + src + ")";
        box.style.backgroundSize = "cover";
        box.style.backgroundPosition = "center";
        box.style.backgroundRepeat = "no-repeat";
        box.innerHTML = "";
      };
      im.src = src;
    })(IMG[a.name], cell.firstChild);
  }
  function setFocus(n) {
    if (n < 0 || n >= cells.length) return;
    cells[cur].className = "cell";
    cur = n;
    cells[cur].className = "cell focus";
  }
  setFocus(0);

  document.onkeydown = function (e) {
    var k = e.keyCode;
    if (k === 37) setFocus(cur - 1);
    else if (k === 39) setFocus(cur + 1);
    else if (k === 13) window.location.href = APPS[cur].url;
    else return;
    if (e.preventDefault) e.preventDefault();
  };
})();
</script>
</body>
</html>
